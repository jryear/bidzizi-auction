[notes]
context = "PROPOSED synthetic staging defaults, reversible before real operations: permitted event viewers can read the approved welcome/sponsors before opening, catalog rows appear only at DB-time opening inclusive, catalog remains read-only after closing exclusive. One immutable approval per event; no replacement/cancel/reschedule. POST accepts only expectedRevision,requestId,lotIds(set); snapshots, saved order/numbers, provider org and local schedule come only from saved SQL. Readiness rules and exact DTO/storage protocol are declared in protected README/protocol fixtures. Invalid/ambiguous local times reject; server converts shared local date/start/end/timezone to UTC. First approval may occur before/during the valid window; new approval after close409 WINDOW_CLOSED, but old identical successful receipt replays after close only current staff authority. Approval receipt excludes dynamic phase. Viewer grants are explicit pre-enrolled event VIEW, separate from staff/business/BID. Database clock_timestamp and the genuinely wired bz_catalog_phase function control phase, not browser/app Date or a cron. New migration adds harmless lock_marker on locked authority tables; nonowner runtime UPDATE only lock_marker cannot change authority. Every fixed group must finish; model review is a probe/comment, never a pass vote. Existing original v1/v2/001a evidence is byte-preserved and cumulative, including empty and populated cases. Infrastructure/dependency99; reached app500/deadlines candidate1/base99; first absent catalog API404 is finite ordinary baseline RED. The real minute-precision transition has30s minimum lead and finishes within300s; no public clock-changing route/env. Protected app-only Node preload is test process instrumentation, verified at HTTP worker, not an application clock feature. Kernel whole-check timeout never establishes baseline readiness."
