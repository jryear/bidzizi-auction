[notes]
context = "Accepted UI foundation is A and approved Event/Lots admin studio with plain copy. First real slice deliberately allows incomplete drafts and uses explicit Save. Staff identities and organization grants are synthetic pre-enrolled server records. Browser identity, role, organization, Member ID, provider, bid history and count never confer authority. Test auth requires explicit BIDZIZI_STAGING_TEST_AUTH=true and either no VERCEL, BIDZIZI_APP_MODE=local-test, loopback APP_ORIGIN and explicitly disposable bz_test_* local DB, or VERCEL_ENV=preview, BIDZIZI_APP_MODE=staging and exact generated .vercel.app origin. Production denies login and existing test sessions even with the flag. Opaque sessions use cryptographic randomBytes(32), confirmed through separate implementation review rather than cookie-length inference; only SHA256 hashes are stored, with expiry/revocation. Cookies must be HttpOnly/SameSite and Secure on HTTPS; HTTPS cookie and positive Vercel/Neon behavior require separate deployed acceptance, not a local proof. Protected responses are no-store. Mutations require exact configured Origin and JSON, payload <=64KiB, whitelist validation and atomic expected-revision/idempotency transaction; every replay rechecks current authority. Evidence compares complete event and ordered lot JSON with SQL, checks denied PUT leaves complete rows/receipts unchanged, forces transaction rejection/retry, and proves a previously authorized delayed response cannot repopulate another person's editor/preview after logout. Existing Neon pooled/TLS connectivity adapter remains immutable. Evidence allocates independent local PostgreSQL18 cluster/database/credentials and Next process per tree/mode, never shared staging. Unavailable infrastructure is exit99; reached app500 or HTTP/browser deadlines are candidate failures and baseline-unverifiable99, never valid baseline RED. Finite ordinary missing-API404 establishes baseline RED; a kernel overall timeout does not. The protected harness relies only on local tools and installed node_modules and never sends SMS/email or applies fixtures to external databases."
out_of_scope = "No real phone/SMS verification, organization onboarding, bidder membership/admission, catalog publication/scheduling, actual bidding, auto-bid, donation/payment/settlement, image upload/storage, production-data access or release claim. Preview is an authenticated saved-draft view, not an audience catalog; audience draft content must not be exposed. Fixture monetary fields use integer minor-unit values without freezing operational currency or increment semantics. The standalone prototype and current SELECT1 adapter must remain unchanged. Provider configuration, branch creation, deployment and final remote E2E are separate approved operations outside this kernel verdict."
