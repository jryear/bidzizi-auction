[notes]
context = "Release inspection found integration-managed DATABASE_URL changed after push. Export databaseConnectionURL() from src/server/config.ts and route actual src/server/db.ts Pool construction through it. In any VERCEL or VERCEL_ENV context, only VERCEL=1, VERCEL_ENV=preview and BIDZIZI_APP_MODE=staging may select nonempty BIDZIZI_STAGING_DATABASE_URL; DATABASE_URL must never serve as deployed staff fallback. Outside Vercel, DATABASE_URL may be used only if disposableDatabase(new URL(value)) succeeds: explicit local-test mode and disposable opt-in, authenticated loopback nonstandard-port bz_test_* database. No authority is conferred by selecting a URL; original test-session/origin/grant gates remain cumulative evidence. The real adapter retains Neon pooled-host validation, allowed TLS modes, URL TLS-override stripping and rejectUnauthorized:true; only explicit disposable local mode has ssl:false. Pure fixed cases run in fresh isolated Node24 processes. A protected loader intercepts pg and @vercel/functions and resolves the existing relative TypeScript config import; fake Pool captures actual options and its connect sentinel prevents transactions and network. All network entry points in the worker are blocked and zero attempts asserted. Cases must finish assertions to score; no model vote or metadata contributes. Missing export is finite ordinary baseline RED. Missing runtime/dependency is infrastructure99; worker timeout is candidate1/base99, never feature-absence RED. Original staff v1 files are byte-preserved from9748ee57da6d3bbc0826df5c9e2271edce28ac24; its original seed-path reference is satisfied by the identical protected v2 seed. Staff v2 packet3983c89aaff31b7a4452d0657111bdada0455343 stays unchanged."
out_of_scope = "No provider reads/writes, real database connections, migrations, hosted login/data writes, production authority, catalog scheduling, bids, SMS, payments, UI feature changes, or change to the existing read-only src/lib/database.ts adapter. Preview variable configuration and exact hosted revision/target/HTTPS E2E are separate authorized release gates. Pending-save, complete preview fidelity, UI creation/reorder and crypto-generator gaps are not added or claimed by this correction."
