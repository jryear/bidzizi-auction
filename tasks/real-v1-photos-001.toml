assertions = ["JOURNEY", "OPERATIONS_UI", "STUDIO_SAVING", "BID_SHEET", "SIMPLE_UI"]
baseline_failures = []

[notes]
assumptions = "Snapshot builds and dev servers use --webpack because Turbopack rejects the linked node_modules; the implementer must also keep the normal Turbopack `pnpm build` green. Loopback Postgres 18 via BZ_CONTRACT_PG; Playwright Chromium and WebKit installed; ripgrep on PATH. Harnesses create and drop their own bz_test_ct_* database. Chained tests/v1 suites are frozen: if a UI change makes one of them outdated, stop and report rather than editing it. tests/v1/items-ui.mjs and tests/v1/photos.mjs exercise the photo-matching dialog and focal editor this tranche replaces, so they are NOT chained: the implementer updates them to the new tray/framing UI, keeping every server guarantee they assert (immutable assets, stale-write protection, guest cannot reposition), and reports them green."
out_of_scope = "Visual acceptance (Zack's). Sponsor-logo framing is in the brief but not asserted here. Native iOS simulator runs. Published-vs-Live naming, events index, Live console, stage configuration. Pushes, merges, deploys and provider resources."
