8132 610,317.40219006669713"/><circle cx="110" cy="297.87733883813627" r="5" fill="#a34d00"/><text x="120" y="315.87733883813627" fill="#a34d00">10.63</text><circle cx="360" cy="296.815155668132" r="5" fill="#a34d00"/><text x="370" y="314.815155668132" fill="#a34d00">10.96</text><circle cx="610" cy="317.40219006669713" r="5" fill="#a34d00"/><text x="620" y="335.40219006669713" fill="#a34d00">6.06</text><text x="90" y="410">50 phones</text><text x="340" y="410">150 phones</text><text x="590" y="410">300 phones</text><text x="110" y="450" fill="#2447d8">● Snapshot p95</text><text x="290" y="450" fill="#a34d00">● Bid p95</text><text x="520" y="450">No hosted capacity claim</text></g></svg>
